<?xml version="1.0" encoding="UTF-8"?>
<!--
  The ScreenLess robot buddy, standing on its own.

  The same geometry the app draws in src/components/buddy, exported flat so it
  can go on a poster or a slide without running React. Keep the two in step: if
  the buddy changes in the app, re-export rather than editing this by hand.

  Drawn in the app's own palette (theme/tokens): coral #FF6B57, sun #FFC53D,
  ink #2A2118, night #1B1710, and the robot's own blues from buddy/specs.

  Mood here is `happy`, which is the one to use when it is standing next to a
  headline. Swap the two eye paths and the mouth path for the `idle` set in the
  comment at the bottom for a calmer version.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -30 236 254" width="472" height="508" role="img" aria-label="ScreenLess robot buddy">
  <title>ScreenLess robot buddy</title>

  <!-- feet -->
  <ellipse cx="78" cy="196" rx="18" ry="11" fill="#5BB4F0" stroke="#2A2118" stroke-width="5"/>
  <ellipse cx="122" cy="196" rx="18" ry="11" fill="#5BB4F0" stroke="#2A2118" stroke-width="5"/>

  <!-- back arm and its mitt -->
  <ellipse cx="56" cy="150" rx="12" ry="21" fill="#5BB4F0" stroke="#2A2118" stroke-width="5" transform="rotate(20,56,150)"/>
  <circle cx="56" cy="172" r="7.5" fill="#3A93D0" stroke="#2A2118" stroke-width="4" transform="rotate(20,56,150)"/>

  <!-- body, with the chest plate the animals get a belly instead of -->
  <g>
    <ellipse cx="100" cy="156" rx="44" ry="41" fill="#5BB4F0" stroke="#2A2118" stroke-width="5"/>
    <path d="M56,156 A44,41 0 0 0 144,156 Z" fill="#3A93D0" opacity="0.5"/>
    <rect x="74" y="136" width="52" height="46" rx="16" fill="#E2F1FF" stroke="#2A2118" stroke-width="4"/>
    <path d="M100,143 L104.2,154.2 L116,154.7 L106.8,162.1 L109.8,173.5 L100,167 L90.2,173.5 L93.2,162.1 L84,154.7 L95.8,154.2 Z"
          fill="#FFC53D" stroke="#F0A81B" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="88" cy="145" rx="8" ry="5" fill="#FFFFFF" opacity="0.45" transform="rotate(-28,88,145)"/>
  </g>

  <!-- front arm and its mitt -->
  <ellipse cx="144" cy="150" rx="12" ry="21" fill="#5BB4F0" stroke="#2A2118" stroke-width="5" transform="rotate(-20,144,150)"/>
  <circle cx="144" cy="172" r="7.5" fill="#3A93D0" stroke="#2A2118" stroke-width="4" transform="rotate(-20,144,150)"/>

  <!-- antenna -->
  <path d="M100,36 L100,10" stroke="#2A2118" stroke-width="7" stroke-linecap="round"/>
  <circle cx="100" cy="2" r="11.5" fill="#FF6B57" stroke="#2A2118" stroke-width="5"/>
  <circle cx="96" cy="-2" r="3.6" fill="#FFFFFF" opacity="0.75"/>

  <!-- ear cups -->
  <circle cx="30" cy="86" r="17" fill="#9BD4FF" stroke="#2A2118" stroke-width="5"/>
  <circle cx="30" cy="86" r="7" fill="#3A93D0"/>
  <circle cx="170" cy="86" r="17" fill="#9BD4FF" stroke="#2A2118" stroke-width="5"/>
  <circle cx="170" cy="86" r="7" fill="#3A93D0"/>

  <!-- head shell and bolts -->
  <rect x="40" y="30" width="120" height="106" rx="34" fill="#5BB4F0" stroke="#2A2118" stroke-width="5"/>
  <circle cx="54" cy="46" r="3.4" fill="#3A93D0"/>
  <circle cx="146" cy="46" r="3.4" fill="#3A93D0"/>
  <circle cx="54" cy="124" r="3.4" fill="#3A93D0"/>
  <circle cx="146" cy="124" r="3.4" fill="#3A93D0"/>

  <!-- screen -->
  <rect x="56" y="54" width="88" height="62" rx="22" fill="#1B1710" stroke="#2A2118" stroke-width="4"/>
  <path d="M70,60 Q100,55 130,60" stroke="#FFFFFF" stroke-width="3" opacity="0.18" fill="none" stroke-linecap="round"/>

  <!-- face: happy -->
  <path d="M71,85 Q80,71 89,85 Z" fill="#EAFFF8"/>
  <path d="M111,85 Q120,71 129,85 Z" fill="#EAFFF8"/>
  <path d="M82,94 Q100,114 118,94 Z" fill="#EAFFF8"/>

  <!--
    idle face, if you want it calmer:
      <circle cx="80" cy="82" r="9" fill="#EAFFF8"/>
      <circle cx="120" cy="82" r="9" fill="#EAFFF8"/>
      <path d="M86,98 Q100,110 114,98" stroke="#EAFFF8" stroke-width="6" stroke-linecap="round" fill="none"/>
  -->
</svg>
