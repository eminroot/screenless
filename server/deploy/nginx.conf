# ScreenLess hub, behind nginx.
#
# Copy to /etc/nginx/sites-available/screenless-hub, link it into
# sites-enabled, then let certbot rewrite the TLS half:
#
#   sudo certbot --nginx -d hub.your-domain.tld
#
# Until a domain points at the box, the plain :80 server below answers on the
# bare IP so the apps can be pointed at http://<ip> during development. Take
# that out before anything real runs through it: the reports are only numbers,
# but a bearer token over plain http is a bearer token anyone on the wifi has.

upstream screenless_hub {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Uploads are small and requests are frequent; a modest body cap is a free
# defence and 512k matches what server.js will read before it gives up.
client_max_body_size 512k;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot writes its challenge here and nowhere else.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://screenless_hub;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # TRUST_PROXY=1 makes the rate limiter read this, so it has to be set
        # here and it has to be set by nginx rather than passed through from
        # the client, or every limit in the service becomes advisory.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}

